name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android build + JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: JVM unit tests
        run: ./gradlew testDebugUnitTest

      - name: Detekt
        run: ./gradlew detekt

  host-dsp:
    name: Host DSP tests (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S engine/host -B engine/host/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build engine/host/build

      - name: Test
        run: ctest --test-dir engine/host/build --output-on-failure
