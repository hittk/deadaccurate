name: CI

# The repo's default branch is currently the claude/* working branch, so CI
# must fire there; main is included for when the project migrates to it.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  android:
    name: Android build + JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew assembleDebug assembleRelease

      - name: JVM unit tests
        run: ./gradlew testDebugUnitTest

      - name: Detekt
        run: ./gradlew detekt

      # Every run publishes an installable build (Actions -> run ->
      # Artifacts). Both builds are signed with the committed project key,
      # so each newer APK installs over the previous one.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: deadaccurate-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deadaccurate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  host-dsp:
    name: Host DSP tests (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S engine/host -B engine/host/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build engine/host/build

      - name: Test
        run: ctest --test-dir engine/host/build --output-on-failure
