# Project overrides on top of detekt's defaults (buildUponDefaultConfig).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  TooManyFunctions:
    # Intent-handler ViewModels aggregate many small public functions.
    thresholdInClasses: 40
    # Compose UI files are collections of many small top-level composables.
    thresholdInFiles: 24
  LongParameterList:
    # CaptureActions groups every screen intent into one data class.
    constructorThreshold: 16
    # Composables pass state down and events up; parameter lists grow by
    # design and slot-object indirection would only obscure them.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    # Theme palettes are top-level Color(0xFF...) properties.
    ignorePropertyDeclaration: true
